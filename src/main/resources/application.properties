spring.application.name=order-management

spring.datasource.url=jdbc:mysql://localhost:3306/order_management
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Amarjitk@123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8081
#cache
spring.cache.type=simple
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.cache=TRACE

# Spring Security credentials
spring.security.user.name=${APP_SECURITY_USERNAME:orderuser}
spring.security.user.password=${APP_SECURITY_PASSWORD:YourStrongUniquePassword123!}


# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

